<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - FIEL Torcedor</title>
    <link rel="stylesheet" href="auth-style.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-header">
            <a href="index.html" class="back-button">← Voltar</a>
            <div class="logo">PAVILHÃO 1910</div>
        </div>

        <div class="auth-box">
            <h1>Bem-vindo de volta, Fiel!</h1>
            <p class="subtitle">Entre para acessar sua conta</p>

            <form id="loginForm" class="auth-form">
                <div class="form-group">
                    <label for="email">E-mail</label>
                    <input 
                        type="email" 
                        id="email" 
                        name="email" 
                        placeholder="seu@email.com"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="password">Senha</label>
                    <input 
                        type="password" 
                        id="password" 
                        name="password" 
                        placeholder="••••••••"
                        required
                    >
                </div>

                <div class="form-options">
                    <label class="checkbox-label">
                        <input type="checkbox" name="remember">
                        <span>Lembrar de mim</span>
                    </label>
                    <a href="#" class="forgot-link">Esqueci minha senha</a>
                </div>

                <button type="submit" class="submit-button">Entrar</button>

                <div class="divider">
                    <span>ou</span>
                </div>

    

                <p class="switch-auth">
                    Não tem uma conta? 
                    <a href="cadastro.html">Cadastre-se agora</a>
                </p>
            </form>
        </div>

        <div class="auth-footer">
            <p>© 2025 Sport Club Corinthians Paulista</p>
        </div>
    </div>

    <script src="auth-script.js"></script>
</body>
</html>
