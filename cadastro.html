<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - FIEL Torcedor</title>
    <link rel="stylesheet" href="auth-style.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-header">
            <a href="index.html" class="back-button">← Voltar</a>
            <div class="logo">PAVILHÃO 1910</div>
        </div>

        <div class="auth-box large">
            <h1>Faça parte da Fiel!</h1>
            <p class="subtitle">Crie sua conta e tenha acesso a benefícios exclusivos</p>

            <form id="cadastroForm" class="auth-form">
                <div class="form-row">
                    <div class="form-group">
                        <label for="nome">Nome Completo *</label>
                        <input 
                            type="text" 
                            id="nome" 
                            name="nome" 
                            placeholder="Seu nome completo"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="cpf">CPF *</label>
                        <input 
                            type="text" 
                            id="cpf" 
                            name="cpf" 
                            placeholder="000.000.000-00"
                            maxlength="14"
                            required
                        >
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="emailCadastro">E-mail *</label>
                        <input 
                            type="email" 
                            id="emailCadastro" 
                            name="email" 
                            placeholder="seu@email.com"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="telefone">Telefone *</label>
                        <input 
                            type="tel" 
                            id="telefone" 
                            name="telefone" 
                            placeholder="(11) 99999-9999"
                            maxlength="15"
                            required
                        >
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="dataNascimento">Data de Nascimento *</label>
                        <input 
                            type="date" 
                            id="dataNascimento" 
                            name="dataNascimento"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="sexo">Sexo *</label>
                        <select id="sexo" name="sexo" required>
                            <option value="">Selecione</option>
                            <option value="masculino">Masculino</option>
                            <option value="feminino">Feminino</option>
                            <option value="outro">Outro</option>
                            <option value="nao-informar">Prefiro não informar</option>
                        </select>
                    </div>
                </div>

                <div class="section-divider">
                    <span>Endereço</span>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="cep">CEP *</label>
                        <input 
                            type="text" 
                            id="cep" 
                            name="cep" 
                            placeholder="00000-000"
                            maxlength="9"
                            required
                        >
                        <small class="form-help">Digite o CEP para preenchimento automático</small>
                    </div>

                    <div class="form-group">
                        <label for="numero">Número *</label>
                        <input 
                            type="text" 
                            id="numero" 
                            name="numero" 
                            placeholder="Nº"
                            required
                        >
                    </div>
                </div>

                <div class="form-group">
                    <label for="logradouro">Logradouro *</label>
                    <input 
                        type="text" 
                        id="logradouro" 
                        name="logradouro" 
                        placeholder="Rua, Avenida..."
                        required
                        readonly
                    >
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="complemento">Complemento</label>
                        <input 
                            type="text" 
                            id="complemento" 
                            name="complemento" 
                            placeholder="Apto, Bloco..."
                        >
                    </div>

                    <div class="form-group">
                        <label for="bairro">Bairro *</label>
                        <input 
                            type="text" 
                            id="bairro" 
                            name="bairro" 
                            placeholder="Bairro"
                            required
                            readonly
                        >
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="cidade">Cidade *</label>
                        <input 
                            type="text" 
                            id="cidade" 
                            name="cidade" 
                            placeholder="Cidade"
                            required
                            readonly
                        >
                    </div>

                    <div class="form-group">
                        <label for="estado">Estado *</label>
                        <input 
                            type="text" 
                            id="estado" 
                            name="estado" 
                            placeholder="UF"
                            maxlength="2"
                            required
                            readonly
                        >
                    </div>
                </div>

                <div class="section-divider">
                    <span>Senha</span>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="passwordCadastro">Senha *</label>
                        <input 
                            type="password" 
                            id="passwordCadastro" 
                            name="password" 
                            placeholder="Mínimo 8 caracteres"
                            minlength="8"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="confirmPassword">Confirmar Senha *</label>
                        <input 
                            type="password" 
                            id="confirmPassword" 
                            name="confirmPassword" 
                            placeholder="Confirme sua senha"
                            minlength="8"
                            required
                        >
                    </div>
                </div>

                <div class="form-group checkbox-group">
                    <label class="checkbox-label">
                        <input type="checkbox" name="termos" required>
                        <span>
                            Li e aceito os 
                            <a href="#" target="_blank">Termos de Uso</a> e a 
                            <a href="#" target="_blank">Política de Privacidade</a>
                        </span>
                    </label>
                </div>

                <div class="form-group checkbox-group">
                    <label class="checkbox-label">
                        <input type="checkbox" name="newsletter">
                        <span>Quero receber novidades e ofertas exclusivas</span>
                    </label>
                </div>

                <button type="submit" class="submit-button">Criar Conta</button>

                <p class="switch-auth">
                    Já tem uma conta? 
                    <a href="login.html">Faça login</a>
                </p>
            </form>
        </div>

        <div class="auth-footer">
            <p>© 2025 Sport Club Corinthians Paulista</p>
        </div>
    </div>

    <script src="auth-script.js"></script>
</body>
</html>
